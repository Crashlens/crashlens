[pytest]
# Pytest configuration for CrashLens test suite

# Test markers for categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration-style tests (mocked, still local)
    slow: Slow tests (benchmarks, large datasets)
    prometheus: Tests requiring prometheus_client

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts =
    # Show summary of all test outcomes
    -ra
    # Show extra test summary info for failed/error tests
    --strict-markers
    # Show local variables in tracebacks
    -l
    # Verbose output
    -v

# Test paths
testpaths = tests
# Exclude archived test directories
norecursedirs = archived_* __pycache__ *.egg-info .git

# Console output format
console_output_style = progress

# Log configuration
log_cli = false
log_cli_level = INFO

# Coverage options (optional, uncomment if using pytest-cov)
# [coverage:run]
# source = crashlens
# omit =
#     */tests/*
#     */__pycache__/*

# Example usage:
# pytest -q -m unit                    # Run only unit tests
# pytest -q -m integration             # Run only integration tests
# pytest -q -m "not slow"              # Skip slow tests
# pytest -q tests/test_specific.py     # Run specific test file
# pytest -q -k "test_name"             # Run tests matching pattern
