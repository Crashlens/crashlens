# CrashLens Complete Policy Configuration
# Replaces ALL legacy detectors with YAML-driven policy rules

rules:
  # === COST OPTIMIZATION RULES ===
  
  # High Cost Per Request
  - id: high_cost_request
    description: "Flag requests with unusually high cost"  
    match:
      cost: ">0.01"  # Lower threshold for demo
    action: warn
    severity: high
    suggestion: "Consider using a more cost-effective model or optimizing prompt length"
    requires_license: false
    
  # Expensive Model for Simple Tasks (replaces overkill_model_detector.py)
  - id: overkill_expensive_model
    description: "Detect expensive models used for simple tasks"
    match:
      input.model: ["gpt-4", "claude-3-opus", "gpt-4-turbo"]
      usage.prompt_tokens: "<20"  # Very simple tasks
    action: warn
    severity: medium
    suggestion: "Consider using gpt-3.5-turbo or gpt-4o-mini for simple tasks"
    requires_license: false
    
  # Token Limit Violations
  - id: excessive_tokens
    description: "Flag requests with excessive token usage"
    match:
      usage.total_tokens: ">1000"  # Lower threshold for demo
    action: warn
    severity: medium
    suggestion: "Break down large requests into smaller chunks or use summarization"
    requires_license: false
    
  # === PRODUCTION SAFETY RULES ===
  
  # Unauthorized Model Usage
  - id: unauthorized_model_usage
    description: "Block usage of non-approved models in production"
    match:
      input.model: "not in:['gpt-3.5-turbo', 'gpt-4', 'gpt-4o-mini', 'claude-3-haiku']"
    action: fail
    severity: critical
    suggestion: "Use only approved models from the whitelist"
    requires_license: false
    
  # === RETRY & FALLBACK PATTERNS (for logs with retry info) ===
  
  # Retry Loop Detection - Critical Issue (if retry_count exists)
  - id: retry_loop_detection
    description: "Detect excessive retry patterns that indicate system instability"
    match:
      retry_count: ">3"
    action: fail
    severity: critical
    suggestion: "Review retry logic and implement exponential backoff with circuit breakers"
    requires_license: false
    
  # Fallback Failure Detection (if retry info exists)
  - id: fallback_failure_expensive
    description: "Detect unnecessary fallbacks to expensive models after cheaper success"
    match:
      input.model: ["gpt-4", "gpt-4-turbo", "claude-3-opus", "claude-3-sonnet"]
      retry_count: ">0"
    action: warn
    severity: high
    suggestion: "Avoid fallback to expensive models; improve error handling for cheaper models"
    requires_license: false
    
  # === PREMIUM ADVANCED PATTERNS ===
  
  # Premium Rule: Advanced Cost Analysis
  - id: premium_cost_analysis
    description: "Advanced cost analysis and optimization recommendations"
    match:
      cost: ">0.005"  
      input.model: ["gpt-4", "claude-3-opus"]
    action: warn
    severity: medium
    suggestion: "Premium feature: Advanced cost optimization available with license"
    requires_license: true
    
  # Premium Rule: Model Efficiency Analysis
  - id: model_efficiency_analysis
    description: "Advanced analysis of model efficiency and routing optimization"
    match:
      usage.prompt_tokens: ">100"
      input.model: "regex:gpt-4.*"
    action: warn
    severity: medium
    suggestion: "Consider prompt optimization or model downgrade for large inputs"
    requires_license: true
    
  # Premium Rule: Cross-Request Pattern Detection
  - id: cross_request_patterns
    description: "Detect patterns across multiple requests that indicate systemic issues"
    match:
      cost: ">0.001"
      usage.total_tokens: ">50"
    action: warn
    severity: low
    suggestion: "Pattern detected across requests - consider architectural review"
    requires_license: true
    
  # Premium Rule: Fallback Storm Detection 
  - id: fallback_storm_detection
    description: "Detect chaotic model switching patterns indicating poor routing logic"
    match:
      retry_count: ">2"
      input.model: ["gpt-4", "claude-3-opus"]
    action: fail
    severity: high
    suggestion: "Implement stable model routing to prevent chaotic fallback patterns"  
    requires_license: true

# Global Configuration
global:
  max_violations_per_rule: 100
  enable_cost_estimation: true
  enable_pattern_detection: true
  
# Cost Thresholds (USD)
cost_thresholds:
  warning_threshold: 0.005  # Lower for demo
  critical_threshold: 0.02  # Lower for demo  
  daily_budget: 10.00
  monthly_budget: 100.00
