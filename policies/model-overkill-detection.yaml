# Usage Examples

# Basic usage
# crashlens guard logs.jsonl --policy-file policies/model-overkill-detection.yaml

# Fail CI/CD on violations
# crashlens guard logs.jsonl --policy-file policies/model-overkill-detection.yaml --fail-on-violations

# With custom thresholds
# crashlens guard logs.jsonl --policy-file policies/model-overkill-detection.yaml \
#   --config custom-thresholds.yaml

# Generate detailed report
# crashlens guard logs.jsonl --policy-file policies/model-overkill-detection.yaml \
#   --format markdown --output-dir reports/

# Continuous monitoring (weekly)
# crashlens guard production-logs.jsonl \
#   --policy-file policies/model-overkill-detection.yaml \
#   --summary-only --strip-pii

