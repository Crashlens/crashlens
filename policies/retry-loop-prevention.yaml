# Usage Examples

# Basic usage
# crashlens guard logs.jsonl --policy-file policies/retry-loop-prevention.yaml

# Fail CI/CD on violations
# crashlens guard logs.jsonl --policy-file policies/retry-loop-prevention.yaml --fail-on-violations

# Weekly monitoring
# crashlens guard production-logs.jsonl \
#   --policy-file policies/retry-loop-prevention.yaml \
#   --strip-pii --summary-only

# Custom retry thresholds
# crashlens guard logs.jsonl \
#   --policy-file policies/retry-loop-prevention.yaml \
#   --config custom-retry-config.yaml

