rules:
  # Test 1: IN operator with dict format
  - id: TEST_IN_DICT
    description: "Test IN operator with dict format"
    if:
      input.model:
        in: ['gpt-4o', 'claude-3-opus']
    then: warn
    action: warn
    severity: warn
    message: "Premium model detected (dict format)"

  # Test 2: IN operator with list shorthand
  - id: TEST_IN_LIST
    description: "Test IN operator with list shorthand"
    if:
      input.model: ['gpt-3.5-turbo', 'gpt-4-turbo']
    then: warn
    action: warn
    severity: warn
    message: "Standard model detected (list format)"

  # Test 3: NOT IN operator
  - id: TEST_NOT_IN
    description: "Test NOT IN operator"
    if:
      not:
        input.model:
          in: ['gpt-3.5-turbo']
    then: fail
    action: fail_ci
    severity: fatal
    message: "Non-standard model detected"

  # Test 4: AND with IN operator
  - id: TEST_AND_IN
    description: "Test AND with IN operator"
    if:
      and:
        - input.model:
            in: ['gpt-4o', 'claude-3']
        - usage.prompt_tokens:
            '>': 1000
    then: fail
    action: fail_ci
    severity: fatal
    message: "Expensive model with high tokens"
