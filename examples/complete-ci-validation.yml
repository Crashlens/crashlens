name: Complete CrashLens CI Validation

on:
  push:
    paths: ["**/*.jsonl", "**/*.yaml"]
  pull_request:
    paths: ["**/*.jsonl", "**/*.yaml"]

jobs:
  validate-logs:
    name: Validate Logs & Policies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install CrashLens
        run: pip install crashlens
        
      - name: Contract Validation
        run: |
          echo "## 📋 Schema Contract Validation" >> $GITHUB_STEP_SUMMARY
          crashlens scan logs/*.jsonl \
            --contract-check \
            --log-format langfuse-v1 \
            --output markdown >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
        
      - name: Policy Enforcement
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚨 Policy Violations" >> $GITHUB_STEP_SUMMARY
          crashlens scan logs/*.jsonl \
            --policy policies/budget.yaml \
            --log-format langfuse-v1 \
            --output markdown \
            --summary-only \
            --fail-on-policy >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
        
      - name: Token Waste Analysis
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 💰 Token Waste Analysis" >> $GITHUB_STEP_SUMMARY
          crashlens scan logs/*.jsonl \
            --log-format langfuse-v1 \
            --summary-only >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
