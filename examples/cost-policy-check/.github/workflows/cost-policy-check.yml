name: Cost Policy Check

on:
  push:
    branches: ["main"]
    paths: ["**/*.jsonl"]
  pull_request:
    paths: ["**/*.jsonl"]
  workflow_dispatch:

jobs:
  policy-check:
    name: Validate Cost Policy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install CrashLens
        run: |
          pip install .
          
      - name: Run policy validation
        run: |
          crashlens policy-check examples/policies/budget.yaml **/*.jsonl
        id: policy-check
        
      - name: Generate policy report
        if: always()
        run: |
          crashlens policy-check examples/policies/budget.yaml **/*.jsonl --output-format json > policy-report.json
          
      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: policy-report.json
          
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('policy-report.json', 'utf8'));
              const violations = report.violations || [];
              
              if (violations.length > 0) {
                let comment = `## 🚨 Policy Violations Found\n\n`;
                comment += `Found ${violations.length} policy violation(s) in this PR:\n\n`;
                
                for (const v of violations) {
                  comment += `**${v.rule_id}** (${v.severity})\n`;
                  comment += `- Line ${v.line_number}: ${v.reason}\n`;
                  comment += `- 💡 ${v.suggestion}\n\n`;
                }
                
                comment += `Please fix these violations before merging.`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not parse policy report:', error);
            }
