name: Guard Metrics Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'crashlens/guard.py'
      - 'crashlens/metrics.py'
      - 'tests/test_guard.py'
      - '.github/workflows/guard-metrics-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crashlens/guard.py'
      - 'crashlens/metrics.py'
      - 'tests/test_guard.py'
  workflow_dispatch:

jobs:
  test-guard-metrics:
    name: Test Guard Metrics Integration
    runs-on: ubuntu-latest
    
    services:
      pushgateway:
        image: prom/pushgateway:latest
        ports:
          - 9091:9091
        options: >-
          --health-cmd "wget --spider -q http://localhost:9091/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          poetry install --extras metrics
      
      - name: Verify metrics module
        run: |
          poetry run python -c "from crashlens.metrics import MetricsCollector; print('✅ Metrics module imported successfully')"
      
      - name: Run Guard without metrics (baseline)
        run: |
          poetry run crashlens guard fixtures/combined-logs.jsonl \
            --rules policies/retry-loop-detector.yaml \
            --output json \
            --dry-run
      
      - name: Run Guard with metrics push
        env:
          CRASHLENS_PUSHGATEWAY: localhost:9091
          CRASHLENS_METRICS_JOB: guard_ci
        run: |
          poetry run crashlens guard fixtures/combined-logs.jsonl \
            --rules policies/retry-loop-detector.yaml \
            --push-metrics \
            --output json \
            --dry-run
      
      - name: Verify metrics reached Pushgateway
        run: |
          echo "🔍 Checking Pushgateway for crashlens metrics..."
          curl -s http://localhost:9091/metrics | grep -E "^crashlens_guard" || {
            echo "❌ No crashlens_guard metrics found in Pushgateway"
            exit 1
          }
          echo "✅ Metrics successfully pushed to Pushgateway"
      
      - name: Display all crashlens metrics
        run: |
          echo "📊 All CrashLens Guard metrics in Pushgateway:"
          curl -s http://localhost:9091/metrics | grep "^crashlens_guard" | head -20
      
      - name: Verify specific metrics exist
        run: |
          echo "Checking for required metrics..."
          
          metrics=(
            "crashlens_guard_runs_total"
            "crashlens_guard_violations_total"
            "crashlens_guard_logs_processed_total"
            "crashlens_guard_duration_seconds"
            "crashlens_guard_latency_ms"
            "crashlens_guard_last_run_timestamp"
            "crashlens_guard_active_rules"
          )
          
          for metric in "${metrics[@]}"; do
            if curl -s http://localhost:9091/metrics | grep -q "^${metric}"; then
              echo "✅ ${metric} found"
            else
              echo "❌ ${metric} NOT found"
              exit 1
            fi
          done
          
          echo "🎉 All required metrics verified!"
