name: Guard Smoke Test

on:
  pull_request:
    paths:
      - 'crashlens/guard.py'
      - 'crashlens/cli.py'
      - '.crashlens/**'
      - 'fixtures/**'
      - '.github/workflows/guard-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Guard Smoke Test (Proof of Concept)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: |
          poetry install --no-interaction
      
      - name: Run guard smoke test
        id: smoke_test
        continue-on-error: true
        run: |
          echo "🔍 Running guard smoke test..."
          poetry run crashlens guard fixtures/combined-logs.jsonl \
            --rules .crashlens/rules.yaml \
            --fail-on-violations \
            --severity error \
            --output text || echo "Guard detected violations (expected)"
      
      - name: Verify artifact was created
        run: |
          if ls guard-*.json 1> /dev/null 2>&1; then
            echo "✅ Artifact created successfully"
            echo "Artifact contents:"
            cat guard-*.json | head -n 20
          else
            echo "❌ ERROR: No artifact found!"
            exit 1
          fi
      
      - name: Upload guard smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashlens-guard-smoke
          path: guard-*.json
          retention-days: 30
      
      - name: Smoke test summary
        if: always()
        run: |
          echo "## 🔍 Guard Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This smoke test validates that:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Guard command runs without crashing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ JSONL parsing works correctly" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Rules are evaluated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Artifact is created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Test completed" >> $GITHUB_STEP_SUMMARY
