name: CrashLens Guard

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.crashlens/**'
      - 'fixtures/**'
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - '.crashlens/**'
      - 'fixtures/**'
  workflow_dispatch:

jobs:
  guard:
    name: Policy Enforcement Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      
      - name: Install project
        run: poetry install --no-interaction
      
      - name: Generate Run ID (Provenance)
        id: runid
        run: |
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)"
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "📋 Run ID: ${RUN_ID}"
          echo "CRASHLENS_RUN_ID=${RUN_ID}" >> $GITHUB_ENV
      
      - name: Run CrashLens guard
        env:
          CRASHLENS_FAIL_ON_VIOLATIONS: "true"
        run: |
          poetry run crashlens guard fixtures/combined-logs.jsonl \
            --rules .crashlens/rules.yaml \
            --fail-on-violations \
            --severity error \
            --output text
      
      - name: Upload guard report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crashlens-guard-report
          path: guard-*.json
          retention-days: 90
      
      - name: Generate Report Summary
        if: always()
        run: |
          echo "## CrashLens Guard Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** \`${{ steps.runid.outputs.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          poetry run crashlens guard fixtures/combined-logs.jsonl \
            --rules .crashlens/rules.yaml \
            --output md >> $GITHUB_STEP_SUMMARY 2>&1 || true
