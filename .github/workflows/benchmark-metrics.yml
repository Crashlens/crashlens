name: Metrics Performance Benchmark

on:
    push:
        branches:
        - main
    workflow_dispatch:  # Manual trigger only
        inputs:
            iterations:
                description: 'Number of iterations per config'
                required: false
                default: '10'
            test_sampling:
                description: 'Test 10% sampling (true/false)'
                required: false
                default: 'true'

jobs:
  benchmark:
    name: Run Metrics Benchmark on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          poetry --version
          poetry install --extras metrics
      
      - name: Generate 100k trace test file
        run: |
          echo "Generating test file..."
          poetry run python scripts/generate_large_test.py --traces 100000
          echo "Test file info:"
          ls -lh large-test.jsonl
          wc -l large-test.jsonl
      
      - name: Quick validation scan
        run: |
          echo "Running quick validation scan..."
          poetry run crashlens scan large-test.jsonl --format json --report-file validation.json
          echo "✓ Validation passed"
      
      - name: Run benchmark
        id: benchmark
        continue-on-error: true
        run: |
          echo "Starting benchmark..."
          ITERATIONS="${{ github.event.inputs.iterations || '10' }}"
          TEST_SAMPLING="${{ github.event.inputs.test_sampling || 'true' }}"
          
          echo "Configuration: iterations=$ITERATIONS, test_sampling=$TEST_SAMPLING"
          
          # Run benchmark and capture exit code
          set +e  # Don't exit on error
          if [ "$TEST_SAMPLING" = "false" ]; then
            poetry run python scripts/benchmark_100k_proper.py \
              --iterations "$ITERATIONS" \
              --no-sampling-test \
              2>&1 | tee benchmark_results.txt
            BENCHMARK_EXIT_CODE=${PIPESTATUS[0]}
          else
            poetry run python scripts/benchmark_100k_proper.py \
              --iterations "$ITERATIONS" \
              2>&1 | tee benchmark_results.txt
            BENCHMARK_EXIT_CODE=${PIPESTATUS[0]}
          fi
          set -e  # Re-enable exit on error
          
          echo ""
          echo "Benchmark exit code: $BENCHMARK_EXIT_CODE"
          
          if [ $BENCHMARK_EXIT_CODE -ne 0 ]; then
            echo "⚠️  Benchmark script exited with error code $BENCHMARK_EXIT_CODE"
          fi
          
          exit $BENCHMARK_EXIT_CODE
      
      - name: Check benchmark step status
        if: always()
        run: |
          echo "Benchmark step outcome: ${{ steps.benchmark.outcome }}"
          echo "Benchmark step conclusion: ${{ steps.benchmark.conclusion }}"
          
          if [ "${{ steps.benchmark.outcome }}" = "failure" ]; then
            echo "⚠️  Benchmark step failed - check output above"
          fi
      
      - name: Display results summary
        if: always()
        run: |
          echo "=== BENCHMARK RESULTS SUMMARY ==="
          if [ -f benchmark_results.txt ]; then
            # Show file stats
            echo "File size: $(wc -c < benchmark_results.txt) bytes"
            echo "Line count: $(wc -l < benchmark_results.txt) lines"
            echo ""
            # Extract key lines
            grep -E "(Baseline|With metrics|Overhead|PASS|FAIL)" benchmark_results.txt || echo "No summary lines found"
          else
            echo "❌ No results file found"
          fi
      
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4  # ← CHANGED FROM v3 TO v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            benchmark_results.txt
            large-test.jsonl
            validation.json
          retention-days: 30
      
      - name: Check if benchmark passed
        run: |
          echo "=== Checking benchmark status ==="
          
          if [ ! -f benchmark_results.txt ]; then
            echo "❌ ERROR: benchmark_results.txt not found"
            echo "Benchmark script may have crashed before creating output file"
            exit 1
          fi
          
          FILE_SIZE=$(wc -c < benchmark_results.txt)
          LINE_COUNT=$(wc -l < benchmark_results.txt)
          
          echo "File info: $FILE_SIZE bytes, $LINE_COUNT lines"
          
          if [ $FILE_SIZE -eq 0 ]; then
            echo "❌ ERROR: benchmark_results.txt is empty"
            echo "Benchmark script produced no output"
            exit 1
          fi
          
          if [ $LINE_COUNT -lt 10 ]; then
            echo "⚠️  WARNING: Output file is very short ($LINE_COUNT lines)"
            echo "Full content:"
            cat benchmark_results.txt
            exit 1
          fi
          
          echo ""
          echo "=== Last 30 lines of benchmark output ==="
          tail -30 benchmark_results.txt
          echo "=========================================="
          echo ""
          
          if grep -q "✗ FAIL" benchmark_results.txt; then
            echo "❌ Benchmark FAILED - overhead exceeds threshold"
            exit 1
          elif grep -q "✓ PASS" benchmark_results.txt; then
            echo "✅ Benchmark PASSED - overhead acceptable"
            exit 0
          else
            echo "⚠️  Could not determine benchmark result"
            echo "Expected to find either '✓ PASS' or '✗ FAIL' in output"
            echo ""
            echo "Searching for decision gate output:"
            grep -i "decision\|overhead\|threshold\|pass\|fail" benchmark_results.txt || echo "No relevant lines found"
            echo ""
            echo "Checking for errors:"
            grep -i "error\|exception\|traceback" benchmark_results.txt || echo "No errors found in output"
            exit 1
          fi
