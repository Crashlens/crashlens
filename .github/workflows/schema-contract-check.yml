name: 🔍 Langfuse Schema Contract Check

on:
  push:
    paths:
      - '**/*.jsonl'
      - '**/*.py'
  pull_request:
    paths:
      - '**/*.jsonl'
      - '**/*.py'
  workflow_dispatch:
    inputs:
      log_file:
        description: 'Custom log file path to validate'
        required: false
        default: 'tests/demo-logs/sample-violating.jsonl'
      log_format:
        description: 'Log format version to validate against'
        required: false
        default: 'langfuse-v1'
        type: choice
        options:
          - langfuse-v1
          - langfuse-v2

# Ensure only one schema check runs at a time per branch
concurrency:
  group: schema-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-check:
    name: 📋 Schema Contract Validation
    runs-on: ubuntu-latest
    
    steps:
      # ===============================================
      # 🏗️ Environment Setup
      # ===============================================
      
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better context in error messages
          fetch-depth: 0
      
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # Cache pip dependencies for faster builds
          cache: 'pip'
      
      - name: 📦 Install CrashLens CLI
        run: |
          echo "🔧 Installing CrashLens from local source..."
          pip install --upgrade pip
          pip install .
          
          echo "✅ CrashLens installation completed"
          echo "📍 Installed version:"
          crashlens --version || echo "⚠️  Version command not available"
          
          echo "🔍 Available commands:"
          crashlens --help
      
      # ===============================================
      # 🔍 Schema Contract Validation
      # ===============================================
      
      - name: 📂 Verify Test Files Exist
        run: |
          LOG_FILE="${{ github.event.inputs.log_file || 'tests/demo-logs/sample-violating.jsonl' }}"
          echo "🔍 Checking for test file: $LOG_FILE"
          
          if [ ! -f "$LOG_FILE" ]; then
            echo "❌ Error: Test log file not found at: $LOG_FILE"
            echo ""
            echo "📁 Available test files:"
            find tests/ -name "*.jsonl" 2>/dev/null || echo "No test JSONL files found"
            echo ""
            echo "📁 Repository structure:"
            ls -la
            exit 1
          fi
          
          echo "✅ Test file found: $LOG_FILE"
          echo "📊 File size: $(du -h "$LOG_FILE" | cut -f1)"
          echo "📝 Line count: $(wc -l < "$LOG_FILE") lines"
          echo ""
          echo "📋 First few lines of test file:"
          head -n 3 "$LOG_FILE"
      
      - name: 🧪 Run Schema Contract Validation
        id: contract-validation
        run: |
          LOG_FILE="${{ github.event.inputs.log_file || 'tests/demo-logs/sample-violating.jsonl' }}"
          LOG_FORMAT="${{ github.event.inputs.log_format || 'langfuse-v1' }}"
          
          echo "🔍 Starting Langfuse schema contract validation..."
          echo "📂 Log file: $LOG_FILE"
          echo "🏷️  Schema format: $LOG_FORMAT"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "=============================================="
          echo ""
          
          # Show contract requirements first
          echo "📋 Schema contract requirements:"
          crashlens scan --contract-info --log-format "$LOG_FORMAT"
          echo ""
          echo "=============================================="
          echo ""
          
          # Run contract validation
          echo "🧪 Running contract validation..."
          if crashlens scan --contract-check "$LOG_FILE" --log-format "$LOG_FORMAT"; then
            echo ""
            echo "=============================================="
            echo "✅ SUCCESS: All schema contracts validated!"
            echo "🎉 Log file conforms to $LOG_FORMAT schema requirements"
            echo "📊 No contract violations detected"
            echo "contract_status=success" >> $GITHUB_OUTPUT
          else
            exit_code=$?
            echo ""
            echo "=============================================="
            echo "❌ FAILURE: Schema contract violations detected!"
            echo "🚨 Log file does not conform to $LOG_FORMAT schema"
            echo "💡 Check the detailed error messages above"
            echo "contract_status=failure" >> $GITHUB_OUTPUT
            
            # Provide helpful context
            echo ""
            echo "🔧 Debugging information:"
            echo "  • File: $LOG_FILE"
            echo "  • Format: $LOG_FORMAT"
            echo "  • Branch: ${{ github.ref_name }}"
            echo "  • Commit: ${{ github.sha }}"
            echo ""
            echo "💡 To fix these issues:"
            echo "  1. Review the required fields listed above"
            echo "  2. Ensure your log entries include all required fields"
            echo "  3. Check field types match the schema requirements"
            echo "  4. Test locally: crashlens scan --contract-check $LOG_FILE --log-format $LOG_FORMAT"
            
            exit $exit_code
          fi
      
      # ===============================================
      # 📊 Results Summary
      # ===============================================
      
      - name: 📊 Validation Summary
        if: always()
        run: |
          echo "=============================================="
          echo "📋 SCHEMA CONTRACT VALIDATION SUMMARY"
          echo "=============================================="
          echo "📂 Log file: ${{ github.event.inputs.log_file || 'tests/demo-logs/sample-violating.jsonl' }}"
          echo "🏷️  Schema format: ${{ github.event.inputs.log_format || 'langfuse-v1' }}"
          echo "🐍 Python version: 3.10"
          echo "🔧 Runner: ${{ runner.os }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo ""
          
          if [ "${{ steps.contract-validation.outputs.contract_status }}" = "success" ]; then
            echo "✅ Status: PASSED"
            echo "🎉 All schema contracts validated successfully"
            echo "📊 Log file conforms to schema requirements"
          else
            echo "❌ Status: FAILED"
            echo "🚨 Schema contract violations detected"
            echo "💡 Review the validation output above for details"
          fi
          echo "=============================================="
      
      # ===============================================
      # 🚨 Failure Handling
      # ===============================================
      
      - name: 🚨 Contract Validation Failed
        if: failure()
        run: |
          echo ""
          echo "🚨 SCHEMA CONTRACT VALIDATION FAILURE"
          echo "=============================================="
          echo "This workflow failed because the Langfuse log file contains"
          echo "entries that violate the expected schema contract."
          echo ""
          echo "🔧 Common issues and solutions:"
          echo "  • Missing required fields (traceId, startTime, input.model)"
          echo "  • Incorrect field types (strings vs numbers)"
          echo "  • Malformed JSON structure"
          echo "  • Empty or corrupted log files"
          echo ""
          echo "💡 To fix this issue:"
          echo "  1. Check the detailed error messages in the validation step above"
          echo "  2. Ensure all log entries have required fields:"
          echo "     - traceId (string)"
          echo "     - startTime (string, ISO timestamp)"
          echo "     - input.model (string, nested in input object)"
          echo "  3. Validate field types match schema requirements"
          echo "  4. Test locally before pushing:"
          echo "     crashlens scan --contract-check your-file.jsonl --log-format langfuse-v1"
          echo ""
          echo "📚 For more information:"
          echo "  • Check the repository's schema documentation"
          echo "  • Review example log files in tests/demo-logs/"
          echo "  • Use 'crashlens scan --contract-info --log-format langfuse-v1' for requirements"
          echo "=============================================="
          
          exit 1

# ===============================================
# 📚 Workflow Documentation
# ===============================================

# This workflow provides automated schema contract validation for Langfuse logs:
#
# ✅ Triggers:
#   - Push/PR changes to .jsonl or .py files
#   - Manual workflow dispatch with custom parameters
#
# ✅ Features:
#   - Python 3.10 environment setup
#   - Local CrashLens CLI installation
#   - Schema contract validation with detailed reporting
#   - Proper exit codes for CI/CD integration
#   - Comprehensive error messages and debugging info
#   - Manual trigger support for custom file testing
#
# ✅ Manual Dispatch Options:
#   log_file: Custom log file path (default: tests/demo-logs/sample-violating.jsonl)
#   log_format: Schema version to validate (langfuse-v1 or langfuse-v2)
#
# ✅ Exit Codes:
#   0: All schema contracts validated successfully
#   1: Schema contract violations detected
#   >1: Infrastructure or setup errors
