name: Performance Benchmarks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'crashlens/**/*.py'
      - 'tests/**/*.py'
      - 'bench/**'
      - '.github/workflows/bench-unified.yml'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}-bench
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          poetry install --no-interaction --no-root
      
      - name: Install project
        run: poetry install --no-interaction
      
      - name: Install benchmark dependencies
        run: |
          poetry run pip install psutil memory-profiler
      
      - name: Create test data if missing
        run: |
          if [ ! -f sample-logs/demo-logs.jsonl ]; then
            echo '{"timestamp":"2025-01-15T10:00:00Z","model":"gpt-4","prompt_tokens":1000,"completion_tokens":200,"retry_count":0}' > sample-logs/demo-logs.jsonl
          fi
      
      - name: Ensure rules file exists
        run: |
          if [ ! -f .crashlens/rules.yaml ]; then
            mkdir -p .crashlens
            cp policies/retry-loop-detector.yaml .crashlens/rules.yaml
          fi
      
      - name: Run benchmarks
        id: benchmark
        run: |
          poetry run python bench/benchmark_unified.py
        continue-on-error: true
      
      - name: Check benchmark results
        run: |
          # Find the latest benchmark result
          LATEST_RESULT=$(ls -t bench/results/benchmark_*.json | head -1)
          
          if [ -f "$LATEST_RESULT" ]; then
            echo "Benchmark results found: $LATEST_RESULT"
            cat "$LATEST_RESULT"
            
            # Extract overhead values (simplified - actual parsing would be more robust)
            echo ""
            echo "Performance check complete. See results above."
          else
            echo "No benchmark results found"
            exit 1
          fi
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: bench/results/
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find latest benchmark result
            const resultsDir = 'bench/results';
            const files = fs.readdirSync(resultsDir)
              .filter(f => f.startsWith('benchmark_') && f.endsWith('.json'))
              .sort()
              .reverse();
            
            if (files.length === 0) {
              console.log('No benchmark results found');
              return;
            }
            
            const resultFile = path.join(resultsDir, files[0]);
            const results = JSON.parse(fs.readFileSync(resultFile, 'utf8'));
            
            // Find baseline and unified results
            const baseline = results.results.find(r => r.name === 'legacy_guard');
            const unified = results.results.find(r => r.name === 'unified_guard_basic' || r.name === 'guard');
            
            if (!baseline || !unified) {
              console.log('Missing baseline or unified results');
              return;
            }
            
            // Calculate overhead
            const timeOverhead = ((unified.wall_time - baseline.wall_time) / baseline.wall_time) * 100;
            const memoryOverhead = baseline.peak_memory_mb > 0 
              ? ((unified.peak_memory_mb - baseline.peak_memory_mb) / baseline.peak_memory_mb) * 100 
              : 0;
            
            const timePass = Math.abs(timeOverhead) <= results.thresholds.max_time_overhead_percent;
            const memoryPass = Math.abs(memoryOverhead) <= results.thresholds.max_memory_overhead_percent;
            
            // Create comment
            const comment = `## 📊 Performance Benchmark Results
            
            | Metric | Baseline (Legacy) | Unified Engine | Overhead | Threshold | Status |
            |--------|-------------------|----------------|----------|-----------|--------|
            | **Wall Time** | ${baseline.wall_time.toFixed(3)}s | ${unified.wall_time.toFixed(3)}s | ${timeOverhead >= 0 ? '+' : ''}${timeOverhead.toFixed(1)}% | ±${results.thresholds.max_time_overhead_percent}% | ${timePass ? '✅' : '❌'} |
            | **Peak Memory** | ${baseline.peak_memory_mb.toFixed(1)}MB | ${unified.peak_memory_mb.toFixed(1)}MB | ${memoryOverhead >= 0 ? '+' : ''}${memoryOverhead.toFixed(1)}% | ±${results.thresholds.max_memory_overhead_percent}% | ${memoryPass ? '✅' : '❌'} |
            
            **Overall:** ${timePass && memoryPass ? '✅ PASS' : '❌ FAIL'}
            
            <details>
            <summary>📈 All Benchmark Results</summary>
            
            ${results.results.map(r => `
            **${r.name}**
            - Wall Time: ${r.wall_time.toFixed(3)}s
            - CPU Time: ${r.cpu_time.toFixed(3)}s
            - Peak Memory: ${r.peak_memory_mb.toFixed(1)}MB
            - Exit Code: ${r.exit_code}
            `).join('\n')}
            
            </details>
            
            <sub>Benchmark run at ${results.timestamp}</sub>
            `;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if benchmarks exceed thresholds
        if: steps.benchmark.outcome == 'failure'
        run: |
          echo "❌ Performance benchmarks failed - see results above"
          echo ""
          echo "Action Required:"
          echo "1. Review benchmark results in artifacts"
          echo "2. If acceptable, update thresholds in bench/benchmark_unified.py"
          echo "3. If not acceptable, revert performance-impacting changes"
          echo "4. Open an issue with profiling data for investigation"
          exit 1
