name: Crashlens Policy Check

# Trigger the workflow on push and pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Allow manual workflow dispatch for testing
  workflow_dispatch:

jobs:
  crashlens-policy-check:
    name: Run Crashlens Policy Analysis
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Step 2: Set up Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    # Step 3: Cache pip dependencies for faster builds
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    # Step 4: Install Crashlens from PyPI
    - name: Install Crashlens
      run: |
        python -m pip install --upgrade pip
        pip install crashlens
        
    # Step 5: Verify Crashlens installation
    - name: Verify Crashlens installation
      run: |
        crashlens --version
        crashlens list-policy-templates
        
    # Step 6: Run policy check on log files
    # This step will fail the CI if high/critical severity violations are found
    - name: Run Crashlens policy check
      run: |
        # Find all .jsonl log files in the repository
        if find . -name "*.jsonl" -type f | grep -q .; then
          echo "Found .jsonl files, running policy check..."
          # Run policy check on all .jsonl files
          find . -name "*.jsonl" -type f -exec crashlens policy-check {} --policy-template all --fail-on-violations --severity-threshold high \;
        else
          echo "No .jsonl log files found. Skipping policy check."
          echo "To use this workflow, add your log files with .jsonl extension to the repository."
        fi
        
    # Step 7: Upload policy results as artifacts (optional)
    - name: Upload policy results
      if: always()  # Run even if previous steps failed
      uses: actions/upload-artifact@v3
      with:
        name: crashlens-policy-results
        path: |
          *.jsonl
          crashlens-*.json
          crashlens-*.md
        retention-days: 30
        
    # Step 8: Add policy check summary to PR (if running on PR)
    - name: Add policy summary to PR
      if: github.event_name == 'pull_request'
      run: |
        echo "## Crashlens Policy Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Policy check completed. Check the logs above for any violations." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Policy Templates Used**: All built-in templates" >> $GITHUB_STEP_SUMMARY
        echo "**Severity Threshold**: High (blocks high and critical violations)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "For more information, visit: https://github.com/Crashlens/crashlens" >> $GITHUB_STEP_SUMMARY
